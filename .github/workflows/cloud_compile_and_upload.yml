name: Kuriake Streams Cloud Runner

on:
  workflow_dispatch:
    inputs:
      preacher:
        description: 'Target Preacher (selman / chris / lawal)'
        required: true
        default: 'selman'
      source_url:
        description: 'Specific Sermon Audio Source URL (Optional)'
        required: false
        default: ''
      video_title:
        description: 'Video Title Override (Optional)'
        required: false
        default: ''
      privacy:
        description: 'YouTube Video Privacy (public / unlisted / private)'
        required: true
        default: 'public'
      test_mode:
        description: 'Run 60s Fast Verification (true / false)'
        required: false
        default: 'false'

  repository_dispatch:
    types: [trigger-compilation]

jobs:
  cloud-render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Audio Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube API Credentials
        env:
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_CLIENT_SECRET: ${{ secrets.CLIENT_SECRETS_JSON }}
        run: |
          echo "$YT_TOKEN" > youtube_token.json
          echo "$YT_CLIENT_SECRET" > client_secrets.json

      - name: Run Cloud Production & YouTube Upload
        env:
          PYTHONUNBUFFERED: "1"
          PREACHER_INPUT: ${{ github.event.inputs.preacher }}
          PRIVACY_INPUT: ${{ github.event.inputs.privacy }}
          TEST_MODE_INPUT: ${{ github.event.inputs.test_mode }}
          SOURCE_URL_INPUT: ${{ github.event.inputs.source_url }}
          TITLE_INPUT: ${{ github.event.inputs.video_title }}
        run: |
          PREACHER="${PREACHER_INPUT:-selman}"
          PRIVACY="${PRIVACY_INPUT:-public}"
          
          ARGS="--preacher $PREACHER --privacy $PRIVACY"
          
          if [ "$TEST_MODE_INPUT" = "true" ]; then
            ARGS="$ARGS --test_mode"
          fi
          
          if [ -n "$SOURCE_URL_INPUT" ]; then
            ARGS="$ARGS --source_url $SOURCE_URL_INPUT"
          fi

          if [ -n "$TITLE_INPUT" ]; then
            ARGS="$ARGS --title '$TITLE_INPUT'"
          fi

          echo "Executing: python cloud_production_pipeline.py $ARGS"
          python cloud_production_pipeline.py $ARGS

      - name: Post Job Summary
        if: always()
        run: |
          echo "### 🚀 Kuriake Streams Cloud Execution Completed" >> $GITHUB_STEP_SUMMARY
          echo "Rendered on 10Gbps Azure Cloud Datacenter with **Zero PC Resource Usage**." >> $GITHUB_STEP_SUMMARY
